version: '3.8'

services:
  frontend:
    build:
      context: ./frontend-job-notifier
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: job-notifier-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend-job-notifier
      dockerfile: Dockerfile
    container_name: job-notifier-backend
    env_file:
      - ./backend-job-notifier/.env.docker
    depends_on:
      - cloud-sql-proxy
      - rabbitmq
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://cloud-sql-proxy:5432/job-notifier
      - RABBITMQ_HOST=rabbitmq

  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14
    container_name: job-notifier-db-proxy
    command:
      - "${DB_INSTANCE_CONNECTION_NAME}"
      - "--address=0.0.0.0"
      - "--port=5432"
    ports:
      - "5432:5432"
    restart: always

  rabbitmq:
    image: rabbitmq:4-management
    container_name: job-notifier-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  rabbitmq_data:
