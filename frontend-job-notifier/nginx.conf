server {
    listen 80;
    server_name localhost;

    root   /usr/share/nginx/html;

    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Internal location for serving the React SPA Index
    location @frontend {
        try_files $uri /index.html;
    }

    # Reverse proxy for Spring Boot Backend API
    location ~ ^/(auth|admin|user|pref|fosmis|websites|fosmis-notification|test)(/.*)?$ {
        # Intelligent Content-Type Routing:
        # If the user directly types /admin/login or /fosmis-notification in the browser, they want the React UI (text/html).
        if ($http_accept ~* "text/html") {
            error_page 418 = @frontend;
            return 418;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
