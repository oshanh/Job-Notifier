spring.application.name=job-notifier

# =========================================================
# Server
# =========================================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}


# =========================================================
# PostgreSQL
# =========================================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Prevent Cloud SQL Proxy idle timeout warnings
spring.datasource.hikari.max-lifetime=600000


# =========================================================
# SMTP Notifications (Titan/Gmail)
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.titan.email}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${GMAIL_USERNAME}}
spring.mail.password=${MAIL_PASSWORD:${GMAIL_APP_PASSWORD}}
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# Gemini
# =========================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
spring.ai.google.genai.chat.options.temperature=0.7


# =========================================================
# FOSMIS
# =========================================================

notify.email=${DEFAULT_NOTIFY_EMAIL}

fosmis.username=${FOSMIS_USERNAME}
fosmis.pwd=${FOSMIS_PASSWORD}


# =========================================================
# Admin
# =========================================================

admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}


# =========================================================
# RabbitMQ
# =========================================================

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

fosmis.email.concurrency=${FOSMIS_EMAIL_CONCURRENCY:5}


# =========================================================
# Scrapers
# =========================================================

scraper.airport.fixed-rate=${SCRAPER_AIRPORT_FIXED_RATE:30}
scraper.topjobs.fixed-rate=${SCRAPER_TOPJOBS_FIXED_RATE:30}